<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYTH QR</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#222;
}

header{
  background:white;
  text-align:center;
  padding:25px 15px;
  border-bottom:1px solid #ddd;
}

header h1{
  margin:0;
  font-size:32px;
  letter-spacing:2px;
}

header p{
  margin:8px 0 0;
  color:#777;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 15px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:15px;
  padding:15px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card img{
  width:100%;
  height:230px;
  object-fit:contain;
  border-radius:10px;
}

.card h2{
  font-size:20px;
  margin:12px 0 8px;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.card a,
.back{
  display:inline-block;
  padding:10px 20px;
  background:#222;
  color:white;
  text-decoration:none;
  border-radius:8px;
}

.product-page{
  max-width:600px;
  margin:auto;
  background:white;
  border-radius:15px;
  padding:25px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.product-page img{
  width:100%;
  max-height:450px;
  object-fit:contain;
}

.product-page h2{
  font-size:28px;
}

.info{
  text-align:left;
  margin-top:20px;
  line-height:1.8;
}

.back{
  margin-top:20px;
}

.loading{
  text-align:center;
  padding:40px;
}
</style>
</head>

<body>

<header>
  <h1>MYTH</h1>
  <p>Product Verification</p>
</header>

<div class="container">

  <div id="loading" class="loading">
    Loading...
  </div>

  <div id="allProducts" class="products" style="display:none;"></div>

  <div id="singleProduct" style="display:none;"></div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzcl0QNieJxm9lhZ3Y8uBxmP1cs1JyfanQTuPwOpm7iw2apSycenPqPYnwsu26XyRG9/exec";


/* PRODUCT IMAGES */

const images = {

  "hair-lotion":
    "IMG-20240421-WA0026.jpg",

  "hair-shampoo":
    "IMG-20240421-WA0023.jpg",

  "hair-cream":
    "IMG-20250621-WA0009.jpg",

  "face-wash":
    "IMG-20240421-WA0024.jpg",

  "sun-screen":
    "https://github.com/Myth-pharm/MYTH-QR/raw/refs/heads/main/file_0000000216c81f4b3c387eac448a190.png",

  "healing-cream":
    "file_0000000056d4820abc00f0597b1d3b1d.png"

};


const productIds = [
  "hair-lotion",
  "hair-shampoo",
  "hair-cream",
  "face-wash",
  "sun-screen",
  "healing-cream"
];


const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const loading = document.getElementById("loading");
const allProducts = document.getElementById("allProducts");
const singleProduct = document.getElementById("singleProduct");


/* SINGLE PRODUCT */

function showSingleProduct(id){

  fetch(API + "?id=" + encodeURIComponent(id))

    .then(response => response.json())

    .then(data => {

      loading.style.display = "none";
      singleProduct.style.display = "block";

      if(data.error){

        singleProduct.innerHTML = `
          <div class="product-page">
            <h2>Product not found</h2>
            <a class="back" href="./">
              Back to MYTH Products
            </a>
          </div>
        `;

        return;
      }

      singleProduct.innerHTML = `

        <div class="product-page">

          <img
            src="${images[id]}"
            alt="${data.product}"
          >

          <h2>${data.product}</h2>

          <div class="price">
            ${data.price} EGP
          </div>

          <div class="info">

            <b>Batch:</b>
            ${data.batch || ""}

            <br>

            <b>Production Date:</b>
            ${data.productionDate || ""}

            <br>

            <b>Expiry Date:</b>
            ${data.expiryDate || ""}

          </div>

          <a class="back" href="./">
            View All MYTH Products
          </a>

        </div>

      `;

    })

    .catch(error => {

      loading.style.display = "none";
      singleProduct.style.display = "block";

      singleProduct.innerHTML = `

        <div class="product-page">

          <h2>Unable to load product</h2>

          <a class="back" href="./">
            Back to MYTH Products
          </a>

        </div>

      `;

      console.error(error);

    });

}


/* ALL PRODUCTS */

async function showAllProducts(){

  const results = await Promise.all(

    productIds.map(productId =>

      fetch(API + "?id=" + encodeURIComponent(productId))

        .then(response => response.json())

        .then(data => ({
          id: productId,
          data: data
        }))

        .catch(error => ({
          id: productId,
          data: {
            error: true
          }
        }))

    )

  );


  loading.style.display = "none";
  allProducts.style.display = "grid";


  allProducts.innerHTML = results.map(item => {

    const data = item.data;


    if(data.error){

      return `
        <div class="card">
          <h2>Product unavailable</h2>
        </div>
      `;

    }


    return `

      <div class="card">

        <img
          src="${images[item.id]}"
          alt="${data.product}"
        >

        <h2>
          ${data.product}
        </h2>

        <div class="price">
          ${data.price} EGP
        </div>

        <a href="?id=${item.id}">
          View Product
        </a>

      </div>

    `;

  }).join("");

}


/* START */

if(id){

  showSingleProduct(id);

}else{

  showAllProducts();

}

</script>

</body>
</html>
